name: Run DotNet Tests in Backend

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0'

      - name: Restore Dependencies
        working-directory: backend
        run: dotnet restore

      - name: Run Tests
        working-directory: backend
        run: dotnet test --no-build --verbosity normal
